name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: "1.20.1"
            java: "17"
            task: ":common:test :fabric:build :forge:build"
          - workspace: "1.21.1"
            java: "21"
            task: ":common:test :fabric:build :forge:build :neoforge:build"
          - workspace: "26.2"
            java: "25"
            task: ":common:test :fabric:build :neoforge:build"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Build ${{ matrix.workspace }}
        working-directory: ${{ matrix.workspace }}
        run: ./gradlew ${{ matrix.task }} --stacktrace --no-daemon
