name: Build

on:
  push:
    branches: ["26.2"]
  pull_request:
    branches: ["26.2"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: ":common:test"
          - task: ":neoforge:build"
          - task: ":fabric:build"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Build ${{ matrix.task }}
        run: ./gradlew ${{ matrix.task }} --stacktrace
